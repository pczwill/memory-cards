<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>记忆卡片 · 遗忘曲线</title>
    <script>
      try {
        var t = localStorage.getItem('memory-cards:theme')
        document.documentElement.dataset.theme = t === 'ink' ? 'ink' : 'day'
      } catch (e) {
        document.documentElement.dataset.theme = 'day'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
